services:
  - type: web
    name: ai-trip-planner-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: GPLACES_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: TAVILAY_API_KEY
        sync: false
      - key: EXCHANGE_RATE_API_KEY
        sync: false
