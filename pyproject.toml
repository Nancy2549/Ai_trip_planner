[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
    "langchain",
    "langchain-community",
    "langchain-experimental",
    "langchain-google-community[places]",
    "langchain-groq",
    "langchain-openai",
    "langchain-tavily",
    "langgraph",
    "pandas>=3.1.1",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "requests",
    "streamlit",
    "uvicorn",
]

[project.scripts]
ai-trip-planner = "ai_trip_planner:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
